		<pre align="left">
			"Sí, repite la hormiga,
			he visto las estrellas.
			Subí al árbol ,más alto
			que tiene la alameda
			y vi miles de ojos
			dentro de mis tinieblas."
			
			Extracto del poema <cite><b>Los encuentros de un caracol aventurero</b></cite>, de Federico García Lorca.
